# 放入仓库的 .github/workflows/build-android.yml
# 作用：在 GitHub 云端编译 HGhub 的 Android debug APK（你的电脑零环境）
name: build-android

on:
  # 手动触发：Actions 页右上角 "Run workflow"
  workflow_dispatch: {}
  # 推 main 时自动出包
  push:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # GitHub ubuntu-latest 自带 Android SDK，显式指给 Tauri
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm（项目锁的是 pnpm；package.json 里有 pnpm.onlyBuiltDependencies，
      # 这是 pnpm 10 的语法，pnpm 9 解析会报 "packages field missing or empty"，必须用 10）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 注意: 不用 cache: pnpm（会因 pnpm store 预热报 "packages field missing" 炸掉）

      # Rust + 移动端编译目标（arm64 真机）
      - name: Setup Rust (arm64 android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android

      # JDK 17（Tauri 移动端 Gradle 需要）
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK：用 runner 自带 sdkmanager，全量接受 license，只装 Tauri 需要的组件
      # （不用第三方 android-actions/setup-android，它 license 处理在 CI 会卡交互）
      - name: Setup Android SDK
        run: |
          set -e
          SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          echo "using sdkmanager: $SM"
          # 全量接受 license（yes 管道保证 7/8 全部接受，非交互不卡住）
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          # 只装 Tauri 需要的三件套（compileSdk=34）
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 仓库没带 Android 壳工程，必须先 init 生成 src-tauri/gen/android
      # Tauri 2.10 的 init 不带 --org/--appname 参数，自动从 tauri.conf.json 的
      # identifier (com.hghub.huangguo) 推断 org=com.hghub / appname=huangguo，非交互直接过
      - name: Init Android shell project
        run: pnpm tauri android init

      # 出 debug APK（自动用 debug 签名，手机可直接安装）
      - name: Build debug APK
        run: pnpm tauri android build --debug

      # 上传成可下载的 artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hghub-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
